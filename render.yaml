# Render Blueprint — FIIM backend API + managed Postgres.
# Deploy: push this repo, then in Render → "New +" → "Blueprint" and pick it.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: fiim-db
    databaseName: fiim
    user: fiim
    plan: free # NOTE: free Postgres is deleted after 90 days — upgrade for prod.

services:
  - type: web
    name: fiim-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fiim-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Set to the deployed Vercel URL so CORS allows the frontend.
      - key: FRONTEND_URL
        sync: false
