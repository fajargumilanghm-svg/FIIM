# Render Blueprint — FIIM backend API (database is external: Supabase).
# Deploy: push this repo, then in Render → "New +" → "Blueprint" and pick it.
# After it provisions, set DATABASE_URL and FRONTEND_URL in the fiim-api env.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: fiim-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/docs
    autoDeploy: true
    envVars:
      # Supabase Session-pooler connection string (set in the Render dashboard).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Set to the deployed Vercel URL so CORS allows the frontend.
      - key: FRONTEND_URL
        sync: false
